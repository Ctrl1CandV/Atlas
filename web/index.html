    <title>web</title>

  <body>
    <div id="root"></div>
<script>
  (function () {
    var t = localStorage.getItem('atlas-theme');
    if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
