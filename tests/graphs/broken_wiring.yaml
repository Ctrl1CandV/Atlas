# A2 用:并行分支里 c 消费同超步的 b——调度顺序与拓扑不一致,运行期 WiringError。
# (名字校验拦不住这类错误:node_b 真实存在,只是还没产出。)
name: broken_wiring
description: 消费方与产出方被调度进同一个并行超步

nodes:
  - id: node_a
    type: llm
    model: Fake:primary
    prompt: 拆解任务,输出两个子方向。
    consumes: [task]

  - id: node_b
    type: llm
    model: Fake:other
    prompt: 处理方向一。
    consumes: [task, node_a.output]

  - id: node_c
    type: llm
    model: Fake:right
    prompt: 汇总方向一与方向二。  # 声明消费 b,但 b 与自己同超步
    consumes: [task, node_b.output]

edges:
  - from: node_a
    to: node_b
  - from: node_a
    to: node_c
  - from: node_b
    to: END
  - from: node_c
    to: END
