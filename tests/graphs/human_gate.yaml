# human 节点:a 产出方案 → gate 等人批准 → b 终审。
# 批准记录(gate.output)是产物,b 可以引用它。
name: human_gate
description: 人工审批夹具

nodes:
  - id: proposer
    type: llm
    model: Fake:primary
    prompt: 按任务给出方案。
    consumes: [task]

  - id: gate
    type: human
    prompt: 请审阅上游方案。批准后继续,驳回则终止。
    consumes: [task, proposer.output]

  - id: finalizer
    type: llm
    model: Fake:other
    prompt: 结合方案与批准记录,给出终稿。
    consumes: [task, proposer.output, gate.output]

edges:
  - from: proposer
    to: gate
  - from: gate
    to: finalizer
  - from: finalizer
    to: END
