# 并行:fan 无条件扇出到 left/right,join 消费两者(不同超步,合法)。
name: parallel
description: 并行扇出/汇合夹具

nodes:
  - id: fan
    type: llm
    model: Fake:primary
    prompt: 把任务拆成两个独立方向。
    consumes: [task]

  - id: left
    type: llm
    model: Fake:left
    prompt: 处理左方向。
    consumes: [task, fan.output]

  - id: right
    type: llm
    model: Fake:right
    prompt: 处理右方向。
    consumes: [task, fan.output]

  - id: join
    type: llm
    model: Fake:joiner
    prompt: 汇总左右两个方向的结论。
    consumes: [task, left.output, right.output]

edges:
  - from: fan
    to: left
  - from: fan
    to: right
  - from: left
    to: join
  - from: right
    to: join
  - from: join
    to: END
