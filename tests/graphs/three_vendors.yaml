# A7 用:三个节点、三家供应商(real_api 手动跑)。
name: three_vendors
description: 断言 A7 夹具——多厂商异质性

nodes:
  - id: first
    type: llm
    model: Deepseek:deepseek-v4-flash
    prompt: 用一句话说明你对任务的理解。
    consumes: [task]

  - id: second
    type: llm
    model: SuperAI:glm-5.3
    prompt: 结合任务与上游的理解,补充一个不同角度。
    consumes: [task, first.output]

  - id: third
    type: llm
    model: Minimax:MiniMax-M3
    prompt: 综合前两份材料,给一句收束。
    consumes: [task, first.output, second.output]

edges:
  - from: first
    to: second
  - from: second
    to: third
  - from: third
    to: END
