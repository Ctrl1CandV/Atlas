# 条件边+循环:judge 按 verdict 路由,repair 回 maker、done 结束。
# 每个节点都有入边(maker 被 judge 回指),入口必须显式声明。
name: repair_loop
description: 条件边与循环夹具

entry: maker

nodes:
  - id: maker
    type: llm
    model: Fake:looper
    prompt: 按任务与审查意见产出/修订方案。
    consumes: [task]

  - id: judge
    type: llm
    model: Fake:judge
    prompt: 审查方案。verdict 取 repair 或 done。
    consumes: [task, maker.output]
    output_schema:
      required: [verdict]
    route_field: verdict

edges:
  - from: maker
    to: judge
  - from: judge
    when: repair
    to: maker
  - from: judge
    when: done
    to: END

guards:
  max_iterations: 3
