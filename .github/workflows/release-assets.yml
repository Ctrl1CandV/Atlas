name: Release assets

# Stable releases are built only from the tag-push context. The workflow reserves
# the tag with a new draft Release before building, uploads without overwriting,
# and publishes that exact draft only after provenance succeeds.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.13"
      - name: Verify tag context and reserve draft release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_REF: ${{ github.ref }}
          CONTEXT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CONTEXT_REF -notmatch '^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$') {
            throw "Release workflow requires a stable tag-push context, got $env:CONTEXT_REF"
          }
          $tag = $Matches[1]
          $version = $tag.Substring(1)
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Tag ref does not exist: refs/tags/$tag" }
          $tagCommit = (git rev-parse "refs/tags/$tag^{commit}").Trim()
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $tagCommit) {
            throw "Checked-out HEAD $head does not match $tag target $tagCommit"
          }
          if ($env:CONTEXT_SHA -ne $tagCommit) {
            throw "Workflow context SHA $env:CONTEXT_SHA does not match $tag target $tagCommit"
          }
          $projectVersion = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($projectVersion -ne $version) {
            throw "Tag version $version does not match pyproject version $projectVersion"
          }

          $createdJson = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases" `
            -f "tag_name=$tag" -f "target_commitish=$tagCommit" -f "name=$tag" `
            -F draft=true -F prerelease=false -F generate_release_notes=true
          if ($LASTEXITCODE -ne 0) {
            throw "Could not reserve a new draft Release for $tag; an existing release, authentication failure, or API error is fatal"
          }
          $created = $createdJson | ConvertFrom-Json
          if (-not $created.id -or -not $created.draft -or $created.tag_name -ne $tag) {
            throw "GitHub returned an invalid draft Release response for $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$tagCommit" >> $env:GITHUB_OUTPUT
          "release_id=$($created.id)" >> $env:GITHUB_OUTPUT
      - name: Sync locked dependencies
        run: uv sync --locked --all-groups
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Initialize missing runtime configuration
        run: uv run atlas init
      - name: Install Web dependencies from lock
        run: npm --prefix web ci
      - name: Test, lint, and build Web app once
        run: |
          npm --prefix web run lint
          npm --prefix web run build
      - name: Compile Python sources
        run: uv run python -m compileall -q atlas scripts
      - name: Run offline workflow release gate
        run: uv run python scripts/release_workflow_gate.py
      - name: Run clean-init and MCP silence gate
        run: uv run python scripts/release_clean_init_gate.py
      - name: Run published-docs contract gate
        run: uv run python scripts/docs_contract_gate.py
      - name: Build bundle with machine-checked exclusions (E-3)
        shell: pwsh
        env:
          CONTEXT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeVersion = (node --version).Trim()
          uv run python scripts/release_bundle.py `
            --repo . --web-dist web/dist `
            --out "dist/atlas-bundle-$env:RELEASE_TAG.zip" `
            --git-sha "$env:CONTEXT_SHA" --node-version "$nodeVersion"
      - name: Build source distribution only
        run: uv build --sdist
      - name: Verify source distribution name
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $archives = @(Get-ChildItem dist -Filter *.tar.gz)
          if ($archives.Count -ne 1) { throw "Expected exactly one sdist, found $($archives.Count)" }
          $expected = "atlas-$env:RELEASE_VERSION.tar.gz"
          if ($archives[0].Name -ne $expected) {
            throw "Expected $expected, found $($archives[0].Name)"
          }
      - name: Scan and smoke-install source distribution
        run: uv run python scripts/release_sdist_gate.py --dist-dir dist
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/atlas-${{ steps.release.outputs.tag }}.spdx.json
          upload-artifact: false
      - name: Keep only release artifacts in dist
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $keep = @("atlas-$env:RELEASE_VERSION.tar.gz", "atlas-$env:RELEASE_TAG.spdx.json", "atlas-bundle-$env:RELEASE_TAG.zip")
          Get-ChildItem dist -File -Force | Where-Object { $_.Name -notin $keep } |
            Remove-Item -Force
          foreach ($name in $keep) {
            if (-not (Test-Path (Join-Path dist $name))) { throw "Release artifact missing: $name" }
          }
      - name: Generate and verify SHA256 manifest
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -File -Force | Sort-Object Name)
          if ($files.Count -ne 3) { throw "Expected sdist, SBOM and bundle before manifest, found $($files.Count) files" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -Path dist/SHA256SUMS -Value $lines -Encoding ascii
          foreach ($line in Get-Content dist/SHA256SUMS) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed SHA256SUMS line: $line" }
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path dist $Matches[2])).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "SHA256 mismatch for $($Matches[2])" }
          }
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Upload assets to the reserved release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $assets = @(
            "atlas-$env:RELEASE_VERSION.tar.gz",
            "atlas-$env:RELEASE_TAG.spdx.json",
            "atlas-bundle-$env:RELEASE_TAG.zip",
            "SHA256SUMS"
          )
          foreach ($name in $assets) {
            $encodedName = [Uri]::EscapeDataString($name)
            gh api --hostname uploads.github.com --method POST `
              -H "Content-Type: application/octet-stream" `
              --input "dist/$name" `
              "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets?name=$encodedName"
            if ($LASTEXITCODE -ne 0) {
              throw "Asset upload failed for $name; the workflow never selects another Release by tag"
            }
          }
      - name: Publish reserved release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          $publishedJson = gh api --method PATCH `
            "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" `
            -F draft=false -F prerelease=false
          if ($LASTEXITCODE -ne 0) { throw "Could not publish reserved Release $env:RELEASE_ID" }
          $published = $publishedJson | ConvertFrom-Json
          if ($published.draft -or $published.id -ne [long]$env:RELEASE_ID) {
            throw "GitHub returned an invalid published Release response"
          }
      - name: Delete this run's draft after failure
        if: ${{ failure() && steps.release.outputs.release_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Could not inspect Release $env:RELEASE_ID; refusing automatic cleanup"
            exit 0
          }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.id -ne [long]$env:RELEASE_ID -or $release.tag_name -ne $env:RELEASE_TAG) {
            Write-Host "Release identity no longer matches this run; refusing automatic cleanup"
            exit 0
          }
          if (-not $release.draft) {
            Write-Host "Release $env:RELEASE_ID is already published; cleanup will not delete it"
            exit 0
          }
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to remove draft Release $env:RELEASE_ID; manual cleanup is required"
          }
