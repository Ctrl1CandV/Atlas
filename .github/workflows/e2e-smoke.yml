# E-4 浏览器矩阵冒烟(optional)。
# 与主门 CI 明显区分:不随 push/pull_request 触发,只在手动派发与
# release 时运行,不并入双绿门;红了按 flake 制度修根因,不调容差蒙混。
name: e2e-smoke

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  browser-smoke:
    name: E2E browser smoke (chromium, optional)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: Sync locked Python dependencies
        run: uv sync --locked --all-groups
      - name: Initialize missing runtime configuration
        run: uv run atlas init
      - name: Build Web app (server serves web/dist)
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Install e2e dependencies and browsers (chromium + firefox; Edge uses the runner's system install)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium firefox
      - name: Run browser smoke tests (keyboard approval + finale baseline)
        working-directory: e2e
        run: npx playwright test
      - name: Collect traces and screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure-evidence
          path: |
            e2e/test-results/
            e2e/__screenshots__/
          if-no-files-found: ignore
