name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-supported:
    name: Windows supported platform
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sync locked Python dependencies
        run: uv sync --locked --all-groups
      - name: Initialize missing runtime configuration
        run: uv run atlas init
      - name: Install Web dependencies from lock
        run: npm --prefix web ci
      - name: Lint and build Web app
        run: |
          npm --prefix web run lint
          npm --prefix web run build
      - name: Compile Python sources
        run: uv run python -m compileall -q atlas scripts
      - name: Run offline workflow release gate
        run: uv run python scripts/release_workflow_gate.py
      - name: Run clean-init and MCP silence gate
        run: uv run python scripts/release_clean_init_gate.py
      - name: Run published-docs contract gate
        run: uv run python scripts/docs_contract_gate.py
      - name: Scan release surfaces for secrets, private paths, and placeholders
        shell: pwsh
        run: |
          @'
          import re
          from pathlib import Path

          roots = [Path(".github/workflows"), Path("config"), Path("skill"), Path("workflows"), Path("web/src/guide")]
          files = [Path(name) for name in (
              "pyproject.toml", "README.md", "README.en.md", "SECURITY.md",
              "CONTRIBUTING.md", "CHANGELOG.md", "RELEASE_CHECKLIST.md",
              "web/src/GuidePage.tsx", "web/package.json"
          )]
          for root in roots:
              files.extend(path for path in root.rglob("*") if path.is_file())
          excluded = {
              "config/.env", "config/providers.json", "config/capabilities.json",
              "config/pricing.json", "config/models.reference.json", "config/agents.json",
          }
          checks = {
              "GitHub placeholder": re.compile(r"(?:OWNER|ORG)/(?:REPOSITORY|REPO)|<atlas-" + r"repository-url>|https://github\.com/?(?:\s|$)"),
              "private Windows path": re.compile(r"(?<![A-Za-z])[A-Za-z]:[\\/](?![\\/])"),
              "private Unix home": re.compile(r"/(?:Users|home)/[^/\s]+/"),
              "private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "AWS access key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              "GitHub token": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{30,}\b"),
          }
          findings = []
          for path in sorted(set(files)):
              if path.as_posix() in excluded or path.name == "package-lock.json":
                  continue
              text = path.read_text(encoding="utf-8")
              for label, pattern in checks.items():
                  for match in pattern.finditer(text):
                      line = text.count("\n", 0, match.start()) + 1
                      findings.append(f"{path}:{line}: {label}")
          if findings:
              raise SystemExit("release-surface scan failed:\n" + "\n".join(findings))
          print(f"scanned {len(set(files))} release-surface files")
          '@ | uv run python -
      - name: Build source distribution only
        run: uv build --sdist
      - name: Scan and smoke-install source distribution
        run: uv run python scripts/release_sdist_gate.py --dist-dir dist

  ubuntu-compatibility-signal:
    name: Ubuntu compatibility signal (unsupported)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sync clean checkout
        run: uv sync --locked --all-groups
      - name: Initialize missing runtime configuration
        run: uv run atlas init
      - name: Install Web dependencies from lock
        run: npm --prefix web ci
      - name: Lint and build Web app
        run: |
          npm --prefix web run lint
          npm --prefix web run build
      - name: Compile Python sources (compatibility signal)
        run: uv run python -m compileall -q atlas scripts
      - name: Run shared offline release gates
        run: |
          uv run python scripts/release_workflow_gate.py
          uv run python scripts/release_clean_init_gate.py
          uv run python scripts/docs_contract_gate.py

  web-dist-smoke:
    name: Web dist bundle smoke (E-3)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.13"
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sync locked Python dependencies
        run: uv sync --locked --all-groups
      - name: Install Web dependencies from lock and build
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Write manifest and assert startup-side digest equality
        shell: pwsh
        env:
          CONTEXT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeVersion = (node --version).Trim()
          uv run python -c "from atlas.distbundle import write_manifest; from pathlib import Path; write_manifest(Path('web/dist'), git_sha='$env:CONTEXT_SHA', built_at='ci', node_version='$nodeVersion')"
          uv run python -c "from atlas.distbundle import manifest_mismatch; from pathlib import Path; m = manifest_mismatch(Path('web/dist')); assert m is None, m"
      - name: Start atlas-web, probe routes and manifest (E-3)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outLog = Join-Path $env:RUNNER_TEMP "atlas-web.out.log"
          $errLog = Join-Path $env:RUNNER_TEMP "atlas-web.err.log"
          $proc = Start-Process -FilePath "uv" `
            -ArgumentList "run","atlas-web" -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          $dumpLogs = {
            Write-Host "---- atlas-web stdout ----"
            if (Test-Path $outLog) { Get-Content $outLog | ForEach-Object { Write-Host $_ } }
            Write-Host "---- atlas-web stderr ----"
            if (Test-Path $errLog) { Get-Content $errLog | ForEach-Object { Write-Host $_ } }
          }
          try {
            $served = $false
            $lastError = ""
            foreach ($i in 1..60) {
              Start-Sleep -Seconds 1
              # curl.exe 探测(IWR 在 runner 环境下的回环探测不可靠);
              # --noproxy "*" 禁止任何代理设置劫持回环请求
              $code = & curl.exe -s -o NUL -w "%{http_code}" --noproxy "*" --max-time 5 http://127.0.0.1:8321/
              if ("$code" -eq "200") { $served = $true; break }
              $lastError = "http_code=$code"
              if ($proc.HasExited) { break }
            }
            if (-not $served) {
              & $dumpLogs
              throw "atlas-web did not serve 200 on / within 60s; last probe: $lastError; process exited: $($proc.HasExited)"
            }
            $apiCode = & curl.exe -s -o NUL -w "%{http_code}" --noproxy "*" --max-time 10 http://127.0.0.1:8321/api/workflows
            if ("$apiCode" -ne "200") { throw "/api/workflows must stay 200 with a resolved dist (route-order regression); got $apiCode" }
            $mcpCode = & curl.exe -s -o NUL -w "%{http_code}" --noproxy "*" --max-time 10 http://127.0.0.1:8321/mcp
            if ("$mcpCode" -eq "404") { throw "/mcp route lost with a resolved dist (route-order regression)" }
            uv run python -c "from atlas.distbundle import manifest_mismatch; from pathlib import Path; assert manifest_mismatch(Path('web/dist')) is None, 'digest must stay equal while serving'"
          } finally {
            & $dumpLogs
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
