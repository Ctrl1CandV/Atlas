name: Source prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify PEP 440 version maps to release tag
        shell: pwsh
        run: |
          $pythonVersion = uv run --no-project python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if ($pythonVersion -notmatch '^(\d+\.\d+\.\d+)rc(\d+)$') {
            throw "Python version $pythonVersion is not the expected RC PEP 440 form"
          }
          $productVersion = "$($Matches[1])-rc.$($Matches[2])"
          $expectedTag = "v$productVersion"
          if ($expectedTag -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Python $pythonVersion (expected $expectedTag)"
          }
          $initVersion = uv run --no-project python -c "import re, pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('atlas/__init__.py').read_text(encoding='utf-8')).group(1))"
          if ($initVersion -ne $pythonVersion) { throw "atlas/__init__.py is $initVersion, expected $pythonVersion" }
          $webVersion = (Get-Content web/package.json -Raw | ConvertFrom-Json).version
          if ($webVersion -ne $productVersion) { throw "Web version $webVersion, expected $productVersion" }
      - name: Sync locked dependencies
        run: uv sync --locked --all-groups
      - name: Install Web dependencies from lock
        run: npm --prefix web ci
      - name: Test, lint, and build Web app once
        run: |
          npm --prefix web test
          npm --prefix web run lint
          npm --prefix web run build
      - name: Compile and run release tests
        run: |
          uv run python -m compileall -q atlas scripts
          uv run pytest
      - name: Run offline workflow release gate
        run: uv run python scripts/release_workflow_gate.py
      - name: Run clean-init and MCP silence gate
        run: uv run python scripts/release_clean_init_gate.py
      - name: Build source distribution only
        run: uv build --sdist
      - name: Scan and smoke-install source distribution
        run: uv run python scripts/release_sdist_gate.py --dist-dir dist
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/atlas-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - name: Generate SHA256 manifest
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS' } | Sort-Object Name
          if (-not $files) { throw "No release artifacts found" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -Path dist/SHA256SUMS -Value $lines -Encoding ascii
          Get-Content dist/SHA256SUMS
      - name: Verify SHA256 manifest
        shell: pwsh
        run: |
          $entries = Get-Content dist/SHA256SUMS
          if (-not $entries) { throw "SHA256SUMS is empty" }
          foreach ($entry in $entries) {
            if ($entry -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Invalid SHA256SUMS entry: $entry"
            }
            $expected = $Matches[1]
            $artifact = Join-Path dist $Matches[2]
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Manifest artifact missing: $artifact"
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "SHA256 mismatch for $artifact"
            }
          }
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*
      - name: Create source-only prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
