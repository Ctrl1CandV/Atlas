[project]
name = "atlas"
version = "0.1.0rc1"
description = "Local, auditable multi-model workflows defined in YAML"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Atlas contributors" }]
keywords = ["workflow", "langgraph", "mcp", "llm", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "anthropic>=0.122.0",
    "fastapi>=0.141.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.0.0",
    "openai>=3.1.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.3",
]

[project.scripts]
atlas = "atlas.cli:main"
atlas-mcp = "atlas.mcp:main"
atlas-web = "atlas.web:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/.github",
    "/atlas",
    "/config/*.example.json",
    "/config/.env.example",
    "/config/README.md",
    "/demo-project",
    "/docs",
    "/scripts",
    "/skill",
    "/tests",
    "/web/index.html",
    "/web/package.json",
    "/web/package-lock.json",
    "/web/public",
    "/web/src",
    "/web/tsconfig*.json",
    "/web/vite.config.ts",
    "/workflows",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/README.zh-CN.md",
    "/RELEASE_CHECKLIST.md",
    "/SECURITY.md",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = [
    "**/.git/**",
    "**/__pycache__/**",
    "/.zcode",
    "/config/.env",
    "/config/providers.json",
    "/config/models.reference.json",
    "/config/capabilities.json",
    "/config/pricing.json",
    "/config/agents.json",
    "/runs",
    "/web/dist",
    "*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not real_api' --strict-markers"
markers = [
    "real_api: calls configured external model providers and may incur charges; excluded by default",
]
