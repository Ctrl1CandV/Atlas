# 示例 3/6:方案审查与有限重试循环。
# author 产出方案 → reviewer 结构化判定 → 不合格回到 author 重跑(回边)。
# 回边语义(如实说明):consumes 是静态的,重跑轮的输入与首轮相同、
# 不携带 reviewer 的意见——循环是"有界重试",不是"按批注修订"。
# 终止双保险:条件出口(verdict=pass)+ max_iterations 上限(决定 1)。
name: proposal-review-repair-loop
description: 方案产出-审查-有界重试循环,回边有条件出口与轮数上限

meta:
  title: 方案审查与重试循环
  description: 生成方案、结构化审查、不合格自动重试(回边不携带审查反馈);最多 2 轮,超限大声失败
  kind: example
  category: document
  tags: [有限循环, 条件分支, 结构化判定]
  estimated_calls: 每轮 2 次,上限 2 轮
  example_task: 为一个三人团队写一份两周内上线的内部工具技术方案

nodes:
  - id: author
    type: llm
    prompt: |
      按任务产出一份方案。要求:结构完整、内容具体到可执行、无事实性硬伤。
      (若为循环重试轮,你的输入与首轮相同,请在质量上自行加强。)
    consumes: [task]

  - id: reviewer
    type: llm
    timeout_s: 180
    prompt: |
      审查上游方案,输出一个 JSON 对象,恰好三个顶层字段,不要输出任何其他文字:
      verdict:取 pass 或 repair;
      issues:具体问题清单,每条形如
        {"位置": "...", "问题": "...", "建议": "...", "severity": "blocker|major|minor"};
      severity:本次审查的整体严重度,取 blocker / major / minor。
      判定标准:没有 blocker 且 major 不多于 1 个时,verdict 才给 pass。
    consumes: [task, author.output]
    output_schema:
      required: [verdict, issues, severity]
    route_field: verdict

entry: author

edges:
  - from: author
    to: reviewer
  - from: reviewer
    when: pass
    to: END
  - from: reviewer
    when: repair
    to: author

guards:
  max_iterations: 2
